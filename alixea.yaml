alixeaVersion: v1.0
type: component
name: Odoo
description: Odoo ERP & CRM

# A copy of the running code is kept on the disk for the way back from a failed update (init.sh)
requirements:
  diskGiB: 10

supportsAdditionalHosts: { serviceName: 'app' }

hosts:
  - name: Odoo
    identifier: app
    port: 8069

images:
  - identifier: app
    prebuildImage: public.ecr.aws/p8t2q7f4/alixea/component-odoo:[tag]

storage:
  - identifier: data
    uid: 1000
    gid: 1000
    sizeMiB: 2048
  - identifier: home
    uid: 1000
    gid: 1000
    sizeMiB: 2048

parameterGroups:
  - name: Admin login
    identifier: admin
    description: The user is "admin". Change the password in Odoo after the first login
    parameters:
      - name: Password
        identifier: INITIAL_ADMIN_PASSWORD
        type: secret
        defaultValue: '${generate-random-password:12}'
        # It is only read at the first start, an edit later would change nothing
        readOnly: true

  - name: Modules
    identifier: modules
    description: Turning a set off uninstalls its modules and deletes their data
    parameters:
      - name: Update automatically
        identifier: AUTO_UPDATE
        type: boolean
        defaultValue: true
        description: Recommended. Keeps Odoo and its modules secure and up to date
      # Alixea's own two sets are part of every deployment, so they are on and cannot be turned off
      - name: Alixea modules
        identifier: ALIXEA_GENERIC
        type: boolean
        defaultValue: true
        readOnly: true
      - name: Alixea modules version
        identifier: ALIXEA_GENERIC_VERSION
        type: assetVersion
        asset: alixea-generic
      - name: Alixea Finance
        identifier: ALIXEA_FINANCE
        type: boolean
        defaultValue: true
        readOnly: true
      - name: Alixea Finance version
        identifier: ALIXEA_FINANCE_VERSION
        type: assetVersion
        asset: alixea-finance
      - name: Odoo Enterprise
        identifier: ENTERPRISE
        type: boolean
        defaultValue: false
        # One or the other: the console lets neither be turned on while the other is on
        excludes: [OCA]
      - name: Odoo Enterprise version
        identifier: ENTERPRISE_VERSION
        type: assetVersion
        asset: enterprise
      - name: OCA modules
        identifier: OCA
        type: boolean
        defaultValue: false
      - name: OCA modules version
        identifier: OCA_VERSION
        type: assetVersion
        asset: oca

  - name: Database
    identifier: database
    description: A new database name starts Odoo on a new, empty database
    parameters:
      - name: Database name
        identifier: DATABASE
        type: string
        defaultValue: odoo
      - name: Role
        identifier: USER
        type: string
        defaultValue: odoo
      - name: Role password
        identifier: PASSWORD
        type: secret
        defaultValue: '${generate-random-password:16}'

# The image is held too: it moves with the module sets, to the build an admin approved, in one restart
assetUpdates:
  parameter: AUTO_UPDATE
  holdImages: true

# Tags <series>/<version> of private repositories, fetched by the core and mounted at /mnt/addons/<identifier>
assets:
  - identifier: alixea-generic
    repository: alixea-erp/alixea-generic
    tagPrefix: '${COMPONENT_VERSION}/'
    ref: '${ALIXEA_GENERIC_VERSION}'
    parameter: ALIXEA_GENERIC
  - identifier: alixea-finance
    repository: alixea-erp/alixea-finance
    tagPrefix: '${COMPONENT_VERSION}/'
    ref: '${ALIXEA_FINANCE_VERSION}'
    parameter: ALIXEA_FINANCE
  - identifier: enterprise
    repository: alixea-erp/odoo-enterprise
    tagPrefix: '${COMPONENT_VERSION}/'
    ref: '${ENTERPRISE_VERSION}'
    parameter: ENTERPRISE
  - identifier: oca
    repository: alixea-erp/oca
    tagPrefix: '${COMPONENT_VERSION}/'
    ref: '${OCA_VERSION}'
    parameter: OCA

dependencies:
  - identifier: postgres
    package: https://github.com/alixea-erp/addon-postgres#v18.3
    env:
      include:
        - POSTGRES_HOST:HOST
        - POSTGRES_PORT:PORT
        - POSTGRES_USER:POSTGRES_USER
        - POSTGRES_PASSWORD:POSTGRES_PASSWORD
