name: Base Image Check

# Every night: has Odoo published a new image of a series since ours was built? Then it starts Pre-Build for those
# series. The Enterprise fork releases Enterprise of the same day once our image is built, and says in Slack when
# both are ready to try and approve (docs/OdooModules.md, decision 2). Nothing reaches a deployment before an admin
# approves the image.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  IMAGE: public.ecr.aws/p8t2q7f4/alixea/${{ github.event.repository.name }}

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Compare the digests
        id: compare
        run: |
          changed=()
          for series in 18.0 19.0 20.0; do
            published=$(docker buildx imagetools inspect "odoo:$series" --format '{{.Manifest.Digest}}')
            # Empty while our image of the series does not exist yet, which is also a reason to build
            built_from=$(docker buildx imagetools inspect "$IMAGE:$series" --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}' || true)
            echo "Odoo $series publishes $published, ours was built from ${built_from:-nothing}"
            [ "$published" = "$built_from" ] || changed+=("\"$series\"")
          done
          echo "series=[$(IFS=,; echo "${changed[*]}")]" >> "$GITHUB_OUTPUT"

      # A run started by the workflow's own token is allowed for workflow_dispatch, unlike for pushes
      - name: Build the changed series
        if: steps.compare.outputs.series != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ steps.compare.outputs.series }}
        run: |
          gh workflow run Prebuild.yaml --repo "$GITHUB_REPOSITORY" --ref main -f series="$SERIES"
          echo "Started Pre-Build for $SERIES" >> "$GITHUB_STEP_SUMMARY"

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ODOO_RELEASES_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          text="The check for new Odoo images failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$text" '{text: $text}' | curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
