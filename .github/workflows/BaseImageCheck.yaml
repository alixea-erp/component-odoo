name: Base Image Check

# Every Monday: has Odoo published a new image of a series since ours was built? Then it starts Pre-Build for those
# series. 20.0 is checked every week, 18.0 and 19.0 on the first Monday of the month. "Run workflow" checks all
# three. Pre-Build says in Slack when an image is built. The Enterprise fork then releases Enterprise of the same
# day and says so itself (docs/OdooModules.md, decision 2). Nothing reaches a deployment before an admin approves
# the image.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

env:
  IMAGE: public.ecr.aws/p8t2q7f4/alixea/${{ github.event.repository.name }}

jobs:
  check:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Compare the digests
        id: compare
        run: |
          # A label of our image, and nothing while the image does not exist yet. The registry limits anonymous reads, so
          # a read it refuses is tried again and fails the step in the end: it is not an image without the label
          image_label() {
            local attempt
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect "$1" --format "{{index .Image.Config.Labels \"$2\"}}" 2> "$RUNNER_TEMP/inspect-error.txt"; then return 0; fi
              if grep -qi 'not found' "$RUNNER_TEMP/inspect-error.txt"; then return 0; fi
              echo "::warning::Could not read $1, attempt $attempt of 3: $(tail -n 1 "$RUNNER_TEMP/inspect-error.txt")" >&2
              sleep $((attempt * 20))
            done
            echo "::error::Could not read $1. Run the workflow again" >&2
            return 1
          }

          # The older series change little, so a month is often enough for them
          checked="20.0"
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$(date -u +%-d)" -le 7 ]; then checked="18.0 19.0 20.0"; fi
          echo "Checking $checked" >> "$GITHUB_STEP_SUMMARY"

          changed=()
          for series in $checked; do
            published=$(docker buildx imagetools inspect "odoo:$series" --format '{{.Manifest.Digest}}')
            # Empty while our image of the series does not exist yet, which is also a reason to build
            built_from=$(image_label "$IMAGE:$series" org.opencontainers.image.base.digest)
            echo "Odoo $series publishes $published, ours was built from ${built_from:-nothing}"
            [ "$published" = "$built_from" ] || changed+=("\"$series\"")
          done
          echo "series=[$(IFS=,; echo "${changed[*]}")]" >> "$GITHUB_OUTPUT"

      # A run started by the workflow's own token is allowed for workflow_dispatch, unlike for pushes
      - name: Build the changed series
        if: steps.compare.outputs.series != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
          SERIES: ${{ steps.compare.outputs.series }}
        run: |
          gh workflow run Prebuild.yaml --repo "$GITHUB_REPOSITORY" --ref main -f series="$SERIES" -f skip_slack=false
          echo "Started Pre-Build for $SERIES" >> "$GITHUB_STEP_SUMMARY"

      - name: Tell Slack it failed
        if: failure()
        uses: alixea-erp/action-module-set/slack@v1
        with:
          webhook: ${{ secrets.SLACK_ODOO_RELEASES_WEBHOOK_URL }}
          headline: The check for new Odoo images failed
          next: Fix it, then run Base Image Check by hand.
