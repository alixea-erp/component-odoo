name: Pre-Build Components

# The images of the Odoo series. BaseImageCheck.yaml starts this for the series whose Odoo image changed, so a series
# gets a new digest only when Odoo published one; a build every night would be a new digest for nothing. "Run
# workflow" builds them by hand, after a change to Dockerfile or init.sh. Nothing reaches a deployment before an admin
# approves the build. A push to main only builds main, for trying.
on:
  push:
    branches: [main]
    # What is not in the image: a push that changes only these builds nothing
    paths-ignore:
      - '**.md'
      - '.agents/**'
      - '.alixea/**'
      - alixea.yaml
      - .alixeaignore
  workflow_dispatch:
    inputs:
      series:
        description: all, or a JSON list such as ["19.0", "20.0"]
        default: all

env:
  REGISTRY: public.ecr.aws
  # Alixea's images, next to Diploi's p8t2q7f4/diploi/* in the same public registry
  PROJECT: p8t2q7f4/alixea/${{ github.event.repository.name }}

permissions:
  id-token: write
  contents: read

jobs:
  image:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Odoo {0}', matrix.series) || format('main, a test image on Odoo {0}', matrix.series) }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        series: ${{ github.event_name != 'workflow_dispatch' && fromJSON('["19.0"]') || (inputs.series == 'all' && fromJSON('["18.0", "19.0", "20.0"]') || fromJSON(inputs.series)) }}
    env:
      # One build is both the production and the development image: <tag> and <tag>-dev.
      TAG: ${{ github.event_name == 'workflow_dispatch' && matrix.series || 'main' }}

    steps:
      # Always main: init.sh travels in the image, the git tags 18.0, 19.0 and 20.0 only move for the chart
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::300197899440:role/AlixeaPrebuildPushForGithubActions
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # BaseImageCheck.yaml compares this with what Odoo publishes
      - name: Digest of Odoo's image
        id: base
        run: echo "digest=$(docker buildx imagetools inspect odoo:${{ matrix.series }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      # The Enterprise release takes Enterprise at this date, so both stay on the same day (docs/OdooModules.md, phase 4)
      - name: Release date of Odoo's image
        id: release
        uses: alixea-erp/action-module-set/odoo-release@v1
        with:
          series: ${{ matrix.series }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # NOTE! Without provenance the tag is a plain image, whose labels BaseImageCheck.yaml can read
          provenance: false
          build-args: |
            ODOO_SERIES=${{ matrix.series }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}:${{ env.TAG }}-dev.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=docker.io/library/odoo:${{ matrix.series }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            org.alixea.odoo.release=${{ steps.release.outputs.date }}

      - name: Tell Slack it failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_ODOO_RELEASES_WEBHOOK_URL }}
          SERIES: ${{ matrix.series }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || exit 0
          text="The build of the Odoo $SERIES image failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg text "$text" '{text: $text}' | curl --fail --silent --show-error -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
