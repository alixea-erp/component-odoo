name: Pre-Build Components

# The images of the three Odoo series are built by hand ("Run workflow"), on the day the Enterprise fork is tagged:
# a build on every push or every night would be a new digest, and a restart, for every deployment each time.
# BaseImageCheck.yaml says in Slack when Odoo has published a new image. A push to main only builds main, for trying.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: public.ecr.aws
  # Alixea's images, next to Diploi's p8t2q7f4/diploi/* in the same public registry
  PROJECT: p8t2q7f4/alixea/${{ github.event.repository.name }}

permissions:
  id-token: write
  contents: read

jobs:
  image:
    name: Odoo ${{ matrix.series }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        series: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["18.0", "19.0", "20.0"]') || fromJSON('["19.0"]') }}
    env:
      # One build is both the production and the development image: <tag> and <tag>-dev.
      TAG: ${{ github.event_name == 'workflow_dispatch' && matrix.series || 'main' }}

    steps:
      # Always main: init.sh travels in the image, the git tags 18.0, 19.0 and 20.0 only move for the chart
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::300197899440:role/AlixeaPrebuildPushForGithubActions
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      # BaseImageCheck.yaml compares this with what Odoo publishes
      - name: Digest of Odoo's image
        id: base
        run: echo "digest=$(docker buildx imagetools inspect odoo:${{ matrix.series }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # NOTE! Without provenance the tag is a plain image, whose labels BaseImageCheck.yaml can read
          provenance: false
          build-args: |
            ODOO_SERIES=${{ matrix.series }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT }}:${{ env.TAG }}
            ${{ env.REGISTRY }}/${{ env.PROJECT }}:${{ env.TAG }}-dev.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.base.name=docker.io/library/odoo:${{ matrix.series }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
