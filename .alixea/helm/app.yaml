apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  selector:
    matchLabels:
      app: app
  # In every stage: a rolling update would run the old code on a database the new pod is upgrading
  strategy:
    type: Recreate
  replicas: {{ ternary 1 0 .Values.enabled }}
  template:
    metadata:
      labels:
        app: app
        {{- with .Values.build }}
        alixea.dev/build-hash: {{ .hash | quote }}
        alixea.dev/build-attempt: {{ .attempt | default 0 | quote }}
        alixea.dev/commit: {{ $.Values.code.commit | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 10
      initContainers:
        {{- if and (ne .Values.stage "development") .Values.build }}
        # The project's own modules in staging and production are the deployment's commit, which the core fetched into
        # a build folder. Nothing is built: the script the core writes only marks the folder as done
        - name: build
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", {{ .Values.build.script | quote }}]
          env:
            {{- range .Values.build.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
          resources:
            limits:
              memory: {{ .Values.build.memoryMiB }}Mi
          volumeMounts:
            - name: build-folder
              mountPath: /app
        {{- end }}
        # Two runs of the image's init.sh with the same variables and mounts. check-for-updates only reads and says
        # what odoo-init is about to do: a plain start, the first one, or an update and the versions it changes. Its
        # answer is in the pod's status while odoo-init works, which is how the deployment page knows of an update
        {{- range $step := list "check-for-updates" "odoo-init" }}
        - name: {{ $step }}
          image: {{ $.Values.images.app }}
          imagePullPolicy: Always
          # From the image, not from this chart: a fix to it reaches every deployment with the next image.
          # NOTE! What it is handed here (names, paths) is only added to: a new image runs with every older chart
          command:
            - /bin/bash
            {{- if eq $step "check-for-updates" }}
            - -c
            # NOTE! An image from before the check would run its whole init here, so it is asked first
            - 'if grep -q "^check_for_updates()" /init.sh; then exec /bin/bash /init.sh check; fi'
            {{- else }}
            - /init.sh
            {{- end }}
          env:
            - name: PGHOST
              value: {{ $.Values.envMap.HOST.value | quote }}
            - name: PGPORT
              value: {{ $.Values.envMap.PORT.value | quote }}
            # Not PGUSER/PGPASSWORD: Odoo 19+ reads PG* variables and they
            # override odoo.conf, so the superuser must not be exposed as them.
            - name: POSTGRES_USER
              value: {{ $.Values.envMap.POSTGRES_USER.value | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ $.Values.envMap.POSTGRES_PASSWORD.value | quote }}
            - name: ODOO_USER
              value: {{ $.Values.envMap.USER.value | quote }}
            - name: ODOO_PASSWORD
              value: {{ $.Values.envMap.PASSWORD.value | quote }}
            - name: ODOO_DB
              value: {{ $.Values.envMap.DATABASE.value | quote }}
            - name: INITIAL_ADMIN_PASSWORD
              value: {{ $.Values.envMap.INITIAL_ADMIN_PASSWORD.value | quote }}
            # The version of this pod: the image and the fetched tag of each checked set
            - name: ODOO_IMAGE
              value: {{ $.Values.images.app | quote }}
            - name: ALIXEA_MODULE_SETS
              value: "{{- range $identifier, $asset := ($.Values.assets | default dict) }}{{- if $asset.hostPath }}{{ $identifier }}={{ $asset.enabled }} {{ end }}{{- end }}"
            - name: ALIXEA_MODULE_SET_REFS
              value: "{{- range $identifier, $asset := ($.Values.assets | default dict) }}{{- if $asset.hostPath }}{{ $identifier }}={{ base $asset.hostPath }} {{ end }}{{- end }}"
            {{- if and (ne $.Values.stage "development") $.Values.code }}
            # The own modules are a build of this commit, which makes them part of the version
            - name: ODOO_OWN_COMMIT
              value: {{ $.Values.code.commit | quote }}
            {{- end }}
          volumeMounts:
            - name: data-mount
              mountPath: /var/lib/odoo
            {{- if hasKey $.Values.storage "code" }}
            - name: extra-addons-mount
              mountPath: /mnt/extra-addons
            {{- end }}
            {{- if and (ne $.Values.stage "development") $.Values.code }}
            - name: build-folder
              mountPath: /mnt/extra-addons
              subPath: {{ trimPrefix "/" $.Values.folder | quote }}
              readOnly: true
            {{- end }}
            {{- range $identifier, $asset := ($.Values.assets | default dict) }}
            {{- if $asset.hostPath }}
            - name: addons-{{ $identifier }}
              mountPath: /mnt/addons/{{ $identifier }}
              readOnly: true
            {{- end }}
            {{- end }}

        {{- end }}
      containers:
        - name: app
          image: {{ .Values.images.app }}
          imagePullPolicy: Always
          #workingDir: /app/{{ .Values.identifier }}
          #command: ['sh', '-c', 'echo The app is running! && sleep 10000']
          ports:
            - containerPort: 8069
          {{- if eq .Values.stage "development" }}
          workingDir: /app{{ .Values.folder }}
          {{- with .Values.containerCommands.developmentStart }}
          command:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- else }}
          {{- with .Values.containerCommands.productionStart }}
          command:
            - /bin/sh
            - -c
            - |
          {{ . | nindent 14 }}
          {{- end }}
          {{- end }}
          env:
            {{- range .Values.env }}
            - name: {{ .identifier }}
              value: {{ .value | quote }}
            {{- end }}
            - name: APP_PUBLIC_URL
              value: {{ .Values.hosts.app }}
            - name: STAGE
              value: {{ .Values.stage }}
            # A link init.sh sets: the image's code, or the copy of the old code after a failed update
            - name: PYTHONPATH
              value: /var/lib/odoo/code/current
          readinessProbe:
            tcpSocket:
              port: 8069
            periodSeconds: 2
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          volumeMounts:
            - name: data-mount
              mountPath: /var/lib/odoo
            # Persistent Odoo config, initialized by the odoo-init container
            - name: data-mount
              mountPath: /etc/odoo
              subPath: etc-odoo
            {{- if hasKey .Values.storage "home" }}
            - name: home-mount
              mountPath: /home/odoo
            {{- end }}
            {{- if hasKey .Values.storage "code" }}
            - mountPath: /mnt/extra-addons
              name: extra-addons-mount
            {{- end }}
            {{- if and (ne .Values.stage "development") .Values.code }}
            # Read-only, so nothing in the pod can change the code the database was upgraded with
            - name: build-folder
              mountPath: /mnt/extra-addons
              subPath: {{ trimPrefix "/" .Values.folder | quote }}
              readOnly: true
            {{- end }}
            {{- range $identifier, $asset := (.Values.assets | default dict) }}
            {{- if $asset.hostPath }}
            - name: addons-{{ $identifier }}
              mountPath: /mnt/addons/{{ $identifier }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: data-mount
          hostPath:
            path: {{ .Values.storage.data.hostPath }}
        {{- if hasKey .Values.storage "home" }}
        - name: home-mount
          hostPath:
            path: {{ .Values.storage.home.hostPath }}
        {{- end }}
        {{- if hasKey .Values.storage "code" }}
        - name: extra-addons-mount
          hostPath:
            path: "{{ .Values.storage.code.hostPath }}{{ .Values.folder }}"
            type: DirectoryOrCreate
        {{- end }}
        {{- if and (ne .Values.stage "development") .Values.code }}
        - name: build-folder
          hostPath:
            path: {{ .Values.code.hostPath }}
        {{- end }}
        
        {{- range $identifier, $asset := (.Values.assets | default dict) }}
        {{- if $asset.hostPath }}
        - name: addons-{{ $identifier }}
          hostPath:
            path: {{ $asset.hostPath | quote }}
        {{- end }}
        {{- end }}
